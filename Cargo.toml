[package]
name = "undoredo"
version = "0.1.1"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Incremental-diff undo-redo decorator for collections such as HashMap, BTreeMap, StableVec, thunderdome::Arena."
documentation = "https://docs.rs/undoredo"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["undo", "redo", "no_std"]
categories = ["data-structures", "gui", "no-std"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["std", "alloc"]
std = ["alloc"]
alloc = []

[dependencies]
stable-vec = { version = "^0.4", optional = true }
thunderdome = { version = "^0.6", optional = true }

[dev-dependencies]
stable-vec = "^0.4"
thunderdome = "^0.6"
