[workspace]
members = [".", "undoredo_derive"]

[package]
name = "undoredo"
version = "0.10.12"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Undo-redo for Rust using deltas, snapshots, or commands."
repository = "https://github.com/mikwielgus/undoredo"
documentation = "https://docs.rs/undoredo"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["undo", "redo", "no_std"]
categories = ["data-structures", "gui", "no-std", "rust-patterns"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["std"]

## Enables the `Delta` derive macro (and also its constituent macros,
## `ApplyDelta`, `FlushDelta`, `HalfDelta`).
derive = ["undoredo_derive"]

## Enables `serde` support (derives `Serialize` and `Deserialize` traits).
serde = ["dep:serde"]

## Disable for `no_std` compatibility.
std = []

## Enables support of delta-recording for `rstar::RTree` type.
rstar = ["dep:rstar", "maplike/rstar"]

## Enables support of delta-recording for `rstared::RTreed` type.
rstared = ["rstar", "dep:rstared"]

## Enables support of delta-recording for `stable_vec::StableVec` type.
stable-vec = ["dep:stable-vec", "maplike/stable-vec"]

## Enables support of delta-recording for `thunderdome::Arena` type.
thunderdome = ["dep:thunderdome", "maplike/thunderdome"]

[dependencies]
document-features = "0.2"
maplike = { version = "0.9", features = ["derive"] }
rstar = { version = "0.12", optional = true }
rstared = { version = "0.9", optional = true }
serde = { version = "1.0", optional = true, default-features = false, features = ["derive", "alloc"] }
stable-vec = { version = "0.4", optional = true }
thunderdome = { version = "0.6", optional = true }
undoredo_derive = { version = "0.10", optional = true, path = "undoredo_derive" }

[dev-dependencies]
stable-vec = "0.4"
thunderdome = "0.6"
serde = { version = "1.0", features = ["derive"] }
rstar = "0.12"
rstared = "0.9"
# This enables `derive` on the library, which we need for integration tests.
undoredo = { path = ".", default-features = false, features = ["derive", "std"] }

# Version replacements apply only to this crate. We have to keep this here
# and not in `release.toml` because the replacements are applied to each
# workspace member crate separately, and since there is nothing to replace in
# `undoredo_derive`, there will be an error due to no replacement. This solution
# is recommended by `cargo-release`'s FAQ.
[package.metadata.release]
pre-release-replacements = [
  { file = "README.md", search = 'undoredo = \{ version = "[^"]+"([^}]*)\}', replace = '{{crate_name}} = { version = "{{version}}"$1}' },
]

# Use scraped examples.
[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]
rustdoc-args = ["--cfg", "docsrs"]

[[example]]
name = "basic_usage"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "cmd_commit"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "commands"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "snapshots"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "entities"
required-features = ["std", "derive"]
doc-scrape-examples = true

[[example]]
name = "stable_vec"
required-features = ["stable-vec"]
doc-scrape-examples = true

[[example]]
name = "thunderdome"
required-features = ["thunderdome"]
doc-scrape-examples = true

[[example]]
name = "rstar"
required-features = ["rstar"]
doc-scrape-examples = true

[[example]]
name = "rstared"
required-features = ["rstared"]
doc-scrape-examples = true
