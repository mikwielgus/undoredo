[package]
name = "undoredo"
version = "0.1.0"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Incremental-diff undo-redo decorator for containers. No need for traits or commands. Stores diffs, not snapshots. Has built-in implementations for HashMap, BTreeMap, StableVec, thunderdome::Arena."
documentation = "https://docs.rs/undoredo"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["undo", "redo"]
categories = ["data-structures", "gui"]
edition = "2024"

[badges]
maintenance = { status = "actively-developed" }

[features]
default = ["std"]
std = ["alloc"]
alloc = []
all-impls = ["std", "stable-vec", "thunderdome"]

[dependencies]
stable-vec = { version = "^0.4", optional = true }
thunderdome = { version = "^0.6", optional = true }
