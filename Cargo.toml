[workspace]
members = [".", "undoredo_derive"]

[package]
name = "undoredo"
version = "0.9.9"
authors = ["Mikolaj Wielgus <wielgusmikolaj@gmail.com>"]
description = "Undo-redo for Rust using deltas, snapshots, or commands."
repository = "https://github.com/mikwielgus/undoredo"
documentation = "https://docs.rs/undoredo"
readme = "README.md"
license = "MIT OR Apache-2.0"
keywords = ["undo", "redo", "no_std"]
categories = ["data-structures", "gui", "no-std", "rust-patterns"]
edition = "2024"

# README version snippets apply only to this crate; workspace `release.toml` is inherited by
# `undoredo_derive`, which does not contain the same dependency lines (see cargo-release FAQ).
[package.metadata.release]
pre-release-replacements = [
  { file = "README.md", search = 'undoredo = \{ version = "[^"]+"([^}]*)\}', replace = '{{crate_name}} = { version = "{{version}}"$1}' },
]

[badges]
maintenance = { status = "actively-developed" }

[features]
derive = ["undoredo_derive"]
default = ["std"]
std = []
rstar = ["dep:rstar", "maplike/rstar"]
rstared = ["rstar", "dep:rstared", "dep:rstar"]
stable-vec = ["dep:stable-vec", "maplike/stable-vec"]
thunderdome = ["dep:thunderdome", "maplike/thunderdome"]

[dependencies]
maplike = { version = "0.9", features = ["derive"] }
stable-vec = { version = "0.4", optional = true }
rstar = { version = "0.12", optional = true }
rstared = { version = "0.9", optional = true }
thunderdome = { version = "0.6", optional = true }
undoredo_derive = { version = "0.9", optional = true, path = "undoredo_derive" }

[dev-dependencies]
stable-vec = "0.4"
thunderdome = "0.6"
rstar = "0.12"
rstared = "0.9"
undoredo_derive = { path = "undoredo_derive" }

[package.metadata.docs.rs]
cargo-args = ["--all-features", "-Zunstable-options", "-Zrustdoc-scrape-examples"]

[[example]]
name = "basic_usage"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "cmd_commit"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "command"
required-features = ["std"]
doc-scrape-examples = true

[[example]]
name = "stable_vec"
required-features = ["stable-vec"]
doc-scrape-examples = true

[[example]]
name = "thunderdome"
required-features = ["thunderdome"]
doc-scrape-examples = true

[[example]]
name = "rstar"
required-features = ["rstar"]
doc-scrape-examples = true

[[example]]
name = "rstared"
required-features = ["rstared"]
doc-scrape-examples = true
